server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: /admin, /chat... are not real files. Anything that isn't a
  # file falls back to index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }

  # Built asset filenames contain a content hash, so they can be cached "forever".
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Never cache index.html, or visitors would keep an old version after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}